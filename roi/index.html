<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="GBRUTUS customer reactivation value calculator">
<title>GBRUTUS · Customer Reactivation Calculator</title>
<style>
:root{
  --paper:#f3f0e7;--card:#fbfaf5;--ink:#252b22;--muted:#707568;
  --line:#d8d8cb;--olive:#73805e;--olive-soft:#e6e9de;--gold:#b39f70;
  --positive:#355f3a;--negative:#8a4b3d
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
.topbar{height:84px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.mark{width:37px;height:43px;display:grid;place-items:center;background:var(--ink);color:#e3d5ad;
  font:700 18px Georgia,serif;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%)}
.brand{font-size:11px;letter-spacing:2.2px;font-weight:700;flex:1}
.languages{display:flex;gap:3px}
.languages button{border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:3px;font-size:10px;font-weight:700}
.languages button.active{background:#e3e2d8;color:var(--ink)}
.hero{padding:48px 0 34px;display:grid;grid-template-columns:1fr 330px;gap:52px;align-items:end}
.eyebrow{display:flex;align-items:center;gap:9px;color:#70623f;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:17px}
.eyebrow:before{content:"";width:24px;height:1px;background:var(--gold)}
h1{font:400 clamp(36px,5vw,61px)/1.02 Georgia,serif;letter-spacing:-2px;margin:0;max-width:720px}
h1 em{font-style:italic;color:var(--olive)}
.hero p{margin:0 0 4px;border-left:2px solid var(--gold);padding-left:20px;color:var(--muted);font-size:14px;line-height:1.75}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.92fr);gap:24px;align-items:start}
.card{border:1px solid var(--line);background:var(--card);padding:28px;border-radius:4px}
.card-title{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#6d6248;font-weight:700;margin:0 0 24px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
.field .help{display:block;color:var(--muted);font-size:10px;line-height:1.45;min-height:29px;margin-bottom:5px}
.input-wrap{position:relative}
.field input[type=number]{width:100%;height:52px;border:1px solid var(--line);background:white;border-radius:3px;padding:0 44px 0 14px;color:var(--ink);font:400 25px Georgia,serif;outline:0}
.field input[type=number]:focus,.advanced input:focus{border-color:var(--olive);box-shadow:0 0 0 3px #73805e20}
.suffix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.range-row{display:flex;align-items:center;gap:15px;height:52px}
input[type=range]{width:100%;accent-color:var(--olive)}
.range-value{font:400 25px Georgia,serif;white-space:nowrap;min-width:54px;text-align:right}
.advanced{margin-top:25px;padding-top:19px;border-top:1px solid var(--line)}
.advanced summary{list-style:none;cursor:pointer;font-size:11px;font-weight:700;color:#615b4e}
.advanced summary::-webkit-details-marker{display:none}
.advanced summary:before{content:"+ ";color:var(--olive)}
.advanced[open] summary:before{content:"− "}
.advanced-row{margin-top:17px;display:grid;grid-template-columns:1fr 112px;gap:16px;align-items:center}
.advanced-row label{font-size:11px;font-weight:700}
.advanced-row small{display:block;color:var(--muted);font-size:10px;line-height:1.5;margin-top:4px}
.advanced input{width:100%;height:42px;border:1px solid var(--line);background:white;border-radius:3px;padding:0 12px;font:19px Georgia,serif;color:var(--ink);outline:0}
.example{margin-top:21px;padding:12px 14px;background:#f0eee5;color:var(--muted);font-size:10px;line-height:1.55;border-radius:3px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;padding:10px 13px;font-size:10px;font-weight:700}
.actions button.primary{margin-left:auto;background:var(--ink);border-color:var(--ink);color:var(--paper)}
.result{background:var(--ink);color:#f1eddf;border-color:var(--ink);position:sticky;top:20px;overflow:hidden}
.result:after{content:"";position:absolute;width:370px;height:370px;border-radius:50%;border:1px solid #ffffff0c;top:-220px;right:-150px;pointer-events:none}
.result .card-title{color:#bcc5af}
.result-lead{font:400 15px/1.5 Georgia,serif;color:#cbd1c1;margin-bottom:8px}
.result-main{font:400 clamp(40px,5vw,62px)/1 Georgia,serif;letter-spacing:-1px;margin-bottom:8px}
.result-main.negative{color:#e0ae9f}
.result-sub{font-size:11px;line-height:1.55;color:#abb4a3;min-height:34px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:23px;border-top:1px solid #ffffff17;border-bottom:1px solid #ffffff17}
.stat{padding:18px 0}
.stat:nth-child(odd){padding-right:18px;border-right:1px solid #ffffff17}
.stat:nth-child(even){padding-left:18px}
.stat:nth-child(n+3){border-top:1px solid #ffffff17}
.stat span{display:block;color:#aeb7a6;font-size:10px;line-height:1.4}
.stat strong{display:block;font:400 24px Georgia,serif;margin-top:7px}
.verdict{margin-top:21px;padding:14px 15px;border-left:3px solid var(--gold);background:#ffffff06;font-size:12px;line-height:1.6}
.verdict strong{display:block;color:#d7ca9f;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.verdict.good{border-color:#8eaa79}.verdict.good strong{color:#afd19a}
.verdict.bad{border-color:#bd7d67}.verdict.bad strong{color:#e0ad9b}
.reverse{margin-top:19px;padding:17px;border:1px solid #ffffff1c;border-radius:3px}
.reverse-title{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:#bfc8b3;margin-bottom:12px}
.reverse-number{font:400 26px Georgia,serif}
.reverse small{display:block;color:#aeb7a6;font-size:10px;line-height:1.5;margin-top:5px}
.formula{margin:24px 0 36px;border:1px solid var(--line);background:var(--card);padding:28px}
.formula-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px}
.formula h2{font:400 25px Georgia,serif;margin:0}
.formula-head span{font-size:10px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.step{background:var(--card);padding:18px 16px;min-height:112px}
.step-num{color:#75653f;font-size:9px;font-weight:700;letter-spacing:1.4px;margin-bottom:12px}
.step strong{display:block;font:400 18px/1.25 Georgia,serif;margin-bottom:6px}
.step span{color:var(--muted);font-size:10px;line-height:1.45}
.disclaimer{color:var(--muted);font-size:10px;line-height:1.7;text-align:center;max-width:820px;margin:0 auto 34px}
@media(max-width:850px){
 .hero{grid-template-columns:1fr;gap:22px;padding:34px 0 28px}.hero p{max-width:590px}
 .grid{grid-template-columns:1fr}.result{position:relative;top:0}.steps{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
 .wrap{width:min(100% - 24px,1120px)}.topbar{height:auto;min-height:78px;flex-wrap:wrap;padding:13px 0;gap:10px}
 .mark{width:31px;height:36px;font-size:15px}.brand{font-size:9px;letter-spacing:1.4px}.languages{margin-left:auto}
 h1{font-size:40px}.hero{padding-top:29px}.hero p{font-size:12px}
 .card{padding:21px 17px}.fields{grid-template-columns:1fr}.field .help{min-height:auto}
 .stats{grid-template-columns:1fr}.stat,.stat:nth-child(odd),.stat:nth-child(even){padding:14px 0;border-right:0}
 .stat:nth-child(n+2){border-top:1px solid #ffffff17}.formula{padding:21px 17px}.formula-head{display:block}
 .formula-head span{display:block;margin-top:7px}.steps{grid-template-columns:1fr}.step{min-height:0}
}
@media print{
 body{background:white}.wrap{width:100%}.topbar{height:55px}.languages,.actions{display:none}.hero{padding:22px 0;grid-template-columns:1fr 300px}
 h1{font-size:35px}.grid{grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px}.result{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .result-main{font-size:39px}.formula{margin:14px 0;padding:18px}.disclaimer{margin-bottom:0}.step{padding:12px;min-height:90px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="mark">G</div>
  <div class="brand">GBRUTUS · CUSTOMER REACTIVATION</div>
  <nav class="languages" aria-label="Language">
    <button type="button" data-lang="en" class="active">EN</button>
    <button type="button" data-lang="nl">NL</button>
    <button type="button" data-lang="es">ES</button>
  </nav>
</header>

<section class="hero">
  <div>
    <div class="eyebrow" id="kicker"></div>
    <h1 id="title"></h1>
  </div>
  <p id="intro"></p>
</section>

<main class="grid">
  <section class="card" aria-labelledby="inputTitle">
    <h2 class="card-title" id="inputTitle"></h2>
    <div class="fields">
      <div class="field">
        <label for="inactive" id="inactiveLabel"></label>
        <span class="help" id="inactiveHelp"></span>
        <div class="input-wrap">
          <input id="inactive" type="number" min="0" max="1000000" step="10" value="500" inputmode="numeric">
        </div>
      </div>

      <div class="field">
        <label for="ticket" id="ticketLabel"></label>
        <span class="help" id="ticketHelp"></span>
        <div class="input-wrap">
          <input id="ticket" type="number" min="0" max="100000" step="1" value="40" inputmode="decimal">
          <span class="suffix">€</span>
        </div>
      </div>

      <div class="field">
        <label for="recovery" id="recoveryLabel"></label>
        <span class="help" id="recoveryHelp"></span>
        <div class="range-row">
          <input id="recovery" type="range" min="0" max="30" step=".5" value="5">
          <output class="range-value" id="recoveryValue" for="recovery">5%</output>
        </div>
      </div>

      <div class="field">
        <label for="fee" id="feeLabel"></label>
        <span class="help" id="feeHelp"></span>
        <div class="input-wrap">
          <input id="fee" type="number" min="0" max="100000" step="1" value="299" inputmode="decimal">
          <span class="suffix">€</span>
        </div>
      </div>
    </div>

    <details class="advanced">
      <summary id="advancedTitle"></summary>
      <div class="advanced-row">
        <div>
          <label for="margin" id="marginLabel"></label>
          <small id="marginHelp"></small>
        </div>
        <div class="input-wrap">
          <input id="margin" type="number" min="0" max="100" step="1" value="70" inputmode="decimal">
          <span class="suffix">%</span>
        </div>
      </div>
    </details>

    <div class="example" id="exampleNote"></div>
    <div class="actions">
      <button type="button" id="reset"></button>
      <button type="button" class="primary" id="print"></button>
    </div>
  </section>

  <section class="card result" aria-labelledby="resultTitle">
    <h2 class="card-title" id="resultTitle"></h2>
    <div class="result-lead" id="netLabel"></div>
    <div class="result-main" id="netValue" aria-live="polite"></div>
    <div class="result-sub" id="netHelp"></div>

    <div class="stats">
      <div class="stat"><span id="recoveredLabel"></span><strong id="recoveredValue"></strong></div>
      <div class="stat"><span id="revenueLabel"></span><strong id="revenueValue"></strong></div>
      <div class="stat"><span id="contributionLabel"></span><strong id="contributionValue"></strong></div>
      <div class="stat"><span id="returnLabel"></span><strong id="returnValue"></strong></div>
    </div>

    <div class="verdict" id="verdict">
      <strong id="verdictTitle"></strong>
      <span id="verdictText"></span>
    </div>

    <div class="reverse">
      <div class="reverse-title" id="reverseTitle"></div>
      <div class="reverse-number" id="reverseValue"></div>
      <small id="reverseHelp"></small>
    </div>
  </section>
</main>

<section class="formula" aria-labelledby="formulaTitle">
  <div class="formula-head">
    <h2 id="formulaTitle"></h2>
    <span id="formulaSubtitle"></span>
  </div>
  <div class="steps">
    <div class="step"><div class="step-num">01</div><strong id="formula1"></strong><span id="formula1Label"></span></div>
    <div class="step"><div class="step-num">02</div><strong id="formula2"></strong><span id="formula2Label"></span></div>
    <div class="step"><div class="step-num">03</div><strong id="formula3"></strong><span id="formula3Label"></span></div>
    <div class="step"><div class="step-num">04</div><strong id="formula4"></strong><span id="formula4Label"></span></div>
  </div>
</section>

<p class="disclaimer" id="disclaimer"></p>
</div>

var lang="en";
function el(id){return document.getElementById(id)}
function number(id){
  var node=el(id),value=Number(node.value);
  if(!Number.isFinite(value)) value=0;
  return Math.min(Number(node.max)||1000000,Math.max(Number(node.min)||0,value));
}
function money(value){
  return new Intl.NumberFormat(copy[lang].locale,{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(value);
}
function count(value,maxDigits){
  return new Intl.NumberFormat(copy[lang].locale,{maximumFractionDigits:maxDigits||0}).format(value);
}
function text(template,data){
  return template.replace(/\{(\w+)\}/g,function(match,key){return data[key]!==undefined?data[key]:""});
}
function setCopy(){
  var c=copy[lang],ids=["kicker","intro","inputTitle","inactiveLabel","inactiveHelp","ticketLabel","ticketHelp","recoveryLabel","recoveryHelp","feeLabel","feeHelp","advancedTitle","marginLabel","marginHelp","exampleNote","reset","print","resultTitle","netLabel","netHelp","recoveredLabel","revenueLabel","contributionLabel","returnLabel","reverseTitle","formulaTitle","formulaSubtitle","disclaimer"];
  ids.forEach(function(id){el(id).textContent=c[id]});
  el("title").innerHTML=c.title;
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-lang]").forEach(function(button){
    var active=button.dataset.lang===lang;
    button.classList.toggle("active",active);
    button.setAttribute("aria-pressed",String(active));
  });
  calculate();
}
function calculate(){
  var c=copy[lang];
  var inactive=number("inactive");
  var ticket=number("ticket");
  var recovery=number("recovery");
  var fee=number("fee");
  var margin=number("margin");
  var recovered=inactive*recovery/100;
  var revenue=recovered*ticket;
  var contribution=revenue*margin/100;
  var net=contribution-fee;
  var multiple=fee>0?contribution/fee:0;
  var unitContribution=ticket*margin/100;
  var needed=unitContribution>0?Math.ceil(fee/unitContribution):null;
  var neededRate=inactive>0&&needed!==null?needed/inactive*100:0;
  var data={
    inactive:count(inactive),rate:count(recovery,1),recovered:count(recovered,1),
    ticket:money(ticket),revenue:money(revenue),margin:count(margin,1),
    contribution:money(contribution),fee:money(fee),net:money(net),
    missing:money(Math.max(0,-net)),customers:needed===null?"—":count(needed),
    maxFee:money(contribution)
  };
  el("recoveryValue").textContent=count(recovery,1)+"%";
  el("netValue").textContent=money(net);
  el("netValue").classList.toggle("negative",net<0);
  el("recoveredValue").textContent=count(recovered,1);
  el("revenueValue").textContent=money(revenue);
  el("contributionValue").textContent=money(contribution);
  el("returnValue").textContent=fee>0?count(multiple,2)+"×":"—";
  var verdict=el("verdict");
  verdict.className="verdict";
  if(fee===0){
    el("verdictTitle").textContent=c.verdictZero;
    el("verdictText").textContent=c.verdictZeroText;
  }else if(net>=0){
    verdict.classList.add("good");
    el("verdictTitle").textContent=c.verdictGood;
    el("verdictText").textContent=text(c.verdictGoodText,data);
  }else{
    verdict.classList.add("bad");
    el("verdictTitle").textContent=c.verdictBad;
    el("verdictText").textContent=text(c.verdictBadText,data);
  }
  if(needed===null){
    el("reverseValue").textContent=c.impossible;
    el("reverseHelp").textContent="";
  }else{
    data.rate=count(neededRate,1);
    el("reverseValue").textContent=text(c.reverseValue,data);
    el("reverseHelp").textContent=text(c.reverseHelp,data);
  }
  ["1","2","3","4"].forEach(function(i){
    el("formula"+i).textContent=text(c["f"+i],data);
    el("formula"+i+"Label").textContent=c["f"+i+"l"];
  });
}
document.querySelectorAll("input").forEach(function(input){
  input.addEventListener("input",calculate);
  if(input.type==="number"){
    input.addEventListener("change",function(){input.value=number(input.id);calculate()});
  }
});
document.querySelectorAll("[data-lang]").forEach(function(button){
  button.addEventListener("click",function(){lang=button.dataset.lang;setCopy()});
});
el("reset").addEventListener("click",function(){
  document.querySelectorAll("input").forEach(function(input){input.value=input.defaultValue});
  calculate();
});
el("print").addEventListener("click",function(){window.print()});
setCopy();
</script>
</body>
</html>
